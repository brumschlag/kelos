name: CI

on:
  # DELIBERATELY UNFILTERED - do not add a `branches:` filter to either trigger.
  #
  # Both were `branches: [main]`, and the consequence was that CI never ran on any
  # branch other than main. Measured on 2026-09-14: the long-lived
  # `integration/upstream-v0.55.0` branch had 316 commits that were not on main and
  # ZERO workflow runs of any kind, ever - build, verify, test and test-integration
  # had never executed against a single one of them. Pull requests to that branch
  # still rendered a check list (the Label workflow has no branch filter), so it
  # looked gated while nothing was gating it.
  #
  # An enumerated allowlist (`[main, integration/**]`) does not fix that class: it
  # has to be maintained, it silently omits the next long-lived branch, and the
  # omission renders as a green check list rather than as an error. A filter that
  # does not exist cannot go stale. If you need to exclude something, exclude it
  # explicitly with `branches-ignore:` and say why.
  #
  # `tags-ignore` is a different kind of filter and is safe: it excludes ALL tags
  # unconditionally, so it needs no maintenance and cannot omit a new branch. It is
  # here because an unfiltered `push:` also fires on tags, and a `v*` tag push
  # would otherwise run the full matrix a second time alongside release.yaml on a
  # commit its own branch already tested.
  push:
    tags-ignore: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  # `github.event_name` is load-bearing, not decoration. The group was
  # `CI-${{ head_ref || ref_name }}`, which for a push resolves to `CI-<branch>`
  # (head_ref is empty) and for a pull_request ALSO resolves to `CI-<branch>`.
  # With cancel-in-progress that is the same group, so a push and its own
  # `synchronize` PR run - which fire together - would cancel each other, at
  # random, leaving a required check either cancelled or never reported. The old
  # `branches: [main]` filters masked this by making the collision unreachable (a
  # PR head is never main); removing them exposes it. Keying on the event name
  # keeps each trigger's runs cancelling only their own supersedes.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  set-pr-e2e-pending:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Set pending PR E2E status
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TARGET_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: 'pr-e2e',
              description: 'Waiting for test-e2e to complete',
              target_url: process.env.TARGET_URL,
            })

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/consoleserver/frontend/package-lock.json

      - name: Verify
        run: make verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test TEST_FLAGS=-race

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration Test
        run: make test-integration TEST_FLAGS=-race

  test-e2e:
    # The push arm is pinned to main ON PURPOSE, and it is a scope RESTORATION,
    # not a new restriction. While `on.push` was `branches: [main]`, this
    # condition's `event_name == 'push'` could only ever mean "a push to main".
    # Unfiltering the trigger would silently widen it to every push to every
    # branch - and this job is not cheap or side-effect-free: it calls
    # reusable-e2e.yaml with `secrets: inherit`, needs a live cluster and agent
    # credentials, and runs ginkgo with a 30m timeout. On an agent fleet that
    # pushes many short-lived branches that means constant cluster contention and
    # secret exposure on every branch.
    #
    # Naming a branch here is a deliberate trade against the no-filter rule above:
    # if this goes stale the cost is "e2e does not run on pushes to some new
    # long-lived branch", which is visible and bounded, whereas the filter this PR
    # removes failed the other way - nothing ran at all and it looked green.
    # build/verify/test/test-integration now run on every branch; only this
    # cluster-backed job stays pinned.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/reusable-e2e.yaml
    secrets: inherit

  report-pr-e2e-status:
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || github.event_name == 'merge_group'
      )
    needs:
      - set-pr-e2e-pending
      - test-e2e
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Report PR E2E status
        uses: actions/github-script@v7
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_NAME: CI
        with:
          script: |
            const currentRunId = Number(process.env.CURRENT_RUN_ID)
            const currentRunAttempt = Number(process.env.CURRENT_RUN_ATTEMPT)
            const targetSha = process.env.TARGET_SHA
            const result = process.env.TEST_E2E_RESULT

            if (result === 'skipped') {
              core.info('test-e2e was skipped, leaving pr-e2e unchanged')
              return
            }

            // The workflow-runs listing is advisory — used only to detect a
            // strictly newer run that has superseded us. The listing API is
            // eventually consistent and may not yet include the in-flight
            // current run, so an empty or stale listing must not block the
            // status write or pr-e2e gets stuck on pending (see #1029).
            let supersededBy = null
            try {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: process.env.WORKFLOW_EVENT,
                head_sha: targetSha,
                per_page: 100,
              })

              supersededBy = runs.workflow_runs
                .filter((run) => run.name === process.env.WORKFLOW_NAME)
                .find((run) => {
                  if (run.id === currentRunId) {
                    return (run.run_attempt || 1) > currentRunAttempt
                  }
                  return run.id > currentRunId
                })
            } catch (err) {
              core.warning(`Failed to list workflow runs for ${targetSha} (proceeding with status update): ${err.message}`)
            }

            if (supersededBy) {
              core.info(`Skipping stale status update from run ${currentRunId} attempt ${currentRunAttempt}; superseded by run ${supersededBy.id} attempt ${supersededBy.run_attempt || 1}`)
              return
            }

            let state = 'pending'
            let description = 'Waiting for test-e2e to complete'

            if (result === 'success') {
              state = 'success'
              description = 'test-e2e succeeded'
            } else if (result === 'failure' || result === 'cancelled') {
              state = 'failure'
              description = `test-e2e ${result}`
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: targetSha,
              state,
              context: 'pr-e2e',
              description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            })
