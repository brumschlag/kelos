# Helm values for the kelos-pilot deployment on software-engineering EKS.
#
# Only the images built from this fork are overridden. The agent images Foreman
# does not use (codex, gemini, opencode, cursor) and the spawner, session-runtime
# and ghproxy images stay on upstream.
#
# The image tag is NOT set globally: `--version` supplies the tag for every image,
# so bumping it would send upstream images to a tag that does not exist. The two
# fork images carry fully-qualified tags instead, which the controller passes
# through unchanged (cmd/kelos-controller/main.go imageForVersion).

crds:
  # Applied separately with --force-conflicts: upstream kelos owns spec.versions
  # as a server-side-apply field manager, so a plain apply is rejected.
  install: false

controllerImage: 565715328522.dkr.ecr.us-east-1.amazonaws.com/kelos-controller
# Tagged separately from image.tag so --version stays on the upstream release.
controllerImageTag: v0.49.0-hooks2
image:
  # Stays on the upstream release tag. It feeds --version, which supplies the tag
  # for every image not overridden below, so a fork tag here would point the
  # upstream images (codex, gemini, spawner, ...) at a tag that does not exist.
  tag: v0.49.0
  pullPolicy: IfNotPresent

# Carries the tool_use stream parsing that reports tool-calls/tool-breakdown.
claudeCodeImage: 565715328522.dkr.ecr.us-east-1.amazonaws.com/claude-code:v0.49.0-tools

workerRunner:
  # Carries preCommands + postCommands.
  image: 565715328522.dkr.ecr.us-east-1.amazonaws.com/kelos-worker-runner:v0.49.0-prepost

sessionRuntime:
  # Pinned rather than left on the chart default, which is an unqualified
  # repository resolving to :latest. Every other image here is pinned, and the
  # session runtime is the one component that would otherwise drift out from
  # under the v0.49.0 controller on any node that re-pulls.
  #
  # Upstream only, deliberately: the fork changes nothing in the session runtime,
  # and this image is not mirrored to ECR. That makes it the one image the pilot
  # pulls from ghcr.io at Session start, which is unproven on this cluster —
  # verify the first Session pod pulls before relying on it.
  image: ghcr.io/kelos-dev/kelos-session-runtime:v0.49.0
